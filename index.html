<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Mechanical engineering portfolio"><title>Engineering Portfolio</title><style>:root{--bg:#111518;--panel:#1b2226;--ink:#f4f2ec;--muted:#a7afb2;--accent:#d49b63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;padding:22px max(5vw,20px);border-bottom:1px solid #30383b}.logo{font-weight:800;letter-spacing:.12em}nav a{margin-left:22px;color:var(--muted)}nav a:hover,.back:hover{color:var(--accent)}main{max-width:1200px;margin:auto;padding:0 24px}.hero{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:5vw;padding:95px 0}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.22em;font-size:.78rem;font-weight:700}h1{font-size:clamp(2.6rem,6vw,5.8rem);line-height:1.08;letter-spacing:-.05em;margin:15px 0 25px}h2{font-size:clamp(1.8rem,3vw,2.8rem);letter-spacing:-.04em;margin:0 0 14px}h3{margin:12px 0 5px;font-size:1.3rem}p{color:var(--muted)}.hero p{font-size:1.15rem;max-width:630px}.portrait{width:100%;aspect-ratio:4/5;object-fit:cover;background:#293236;border:1px solid #455057}.placeholder{display:grid;place-items:center;background:linear-gradient(145deg,#303a3f,#151b1e);color:#9eabad;text-align:center;padding:25px}.button{display:inline-block;background:var(--accent);color:#151515;padding:12px 20px;font-weight:750;border-radius:3px;margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.tile{display:block;background:var(--panel);border:1px solid #343d40;overflow:hidden;transition:transform .2s,border-color .2s}.tile:hover{transform:translateY(-4px);border-color:var(--accent)}.tile img,.tile .placeholder{width:100%;aspect-ratio:16/10;object-fit:cover}.tile-body{padding:20px 23px 24px}.tag{font-size:.73rem;text-transform:uppercase;letter-spacing:.13em;color:var(--accent)}.tile p{margin:5px 0 0}.project{padding:65px 0}.project>p{max-width:800px}.project-hero{width:100%;max-height:610px;object-fit:cover;margin:26px 0 35px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:35px}.gallery figure{margin:0}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#263035}.gallery figcaption{font-size:.9rem;color:var(--muted);padding:10px 0 20px}.back{color:var(--accent)}footer{border-top:1px solid #343d40;margin-top:100px;padding:35px 5vw;color:var(--muted);display:flex;justify-content:space-between;gap:20px}footer a{color:var(--ink)}@media(max-width:750px){.hero{grid-template-columns:1fr;padding:55px 0}.portrait{max-height:440px}.grid,.gallery{grid-template-columns:1fr}header{padding:18px 20px}nav a{margin-left:12px;font-size:.85rem}footer{flex-direction:column}}</style></head><body><header><a class="logo" href="#/">ENGINEERING / PORTFOLIO</a><nav><a href="#/">Home</a><a href="#projects">Projects</a><a id="emailNav" href="mailto:your.email@example.com">Contact</a></nav></header><main id="app"></main><footer><span id="copyright"></span><span><a id="emailFooter" href="mailto:your.email@example.com">Get in touch</a></span></footer><script src="content.js"></script><script>const app=document.getElementById('app');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function img(src,alt,cls=''){return src?`<img class="${cls}" src="${encodeURI(src)}" alt="${safe(alt)}" loading="lazy">`:`<div class="placeholder ${cls}">Add a photo in the images folder</div>`}function home(){document.title=portfolio.name+' | Engineering Portfolio';app.innerHTML=`<section class="hero"><div><div class="eyebrow">Mechanical engineering · Design · Fabrication</div><h1>${safe(portfolio.name)}</h1><p>${safe(portfolio.bio)}</p><a class="button" href="#projects">Explore my projects ↓</a></div>${img(portfolio.portrait,'Portrait of '+portfolio.name,'portrait')}</section><section id="projects"><div class="section-head"><div><div class="eyebrow">Selected work</div><h2>Projects</h2></div></div><div class="grid">${projects.map(p=>`<a class="tile" href="#/project/${encodeURIComponent(p.slug)}">${img(p.cover,p.title)}<div class="tile-body"><span class="tag">${safe(p.category)}</span><h3>${safe(p.title)}</h3><p>${safe(p.summary)}</p></div></a>`).join('')}</div></section>`}function detail(slug){const p=projects.find(p=>p.slug===slug);if(!p){home();return}document.title=p.title+' | '+portfolio.name;app.innerHTML=`<article class="project"><a class="back" href="#projects">← All projects</a><div class="eyebrow" style="margin-top:35px">${safe(p.category)}</div><h1>${safe(p.title)}</h1><p>${safe(p.summary)}</p>${img(p.cover,p.title,'project-hero')}<h2>Project overview</h2><p>${safe(p.description)}</p><div class="gallery">${(p.gallery||[]).map(g=>`<figure>${img(g.image,g.caption)}<figcaption>${safe(g.caption)}</figcaption></figure>`).join('')}</div></article>`;window.scrollTo(0,0)}function route(){const hash=decodeURIComponent(location.hash);if(hash.startsWith('#/project/'))detail(hash.slice(10));else {home();if(hash==='#projects')setTimeout(()=>document.getElementById('projects')?.scrollIntoView(),0)}}window.addEventListener('hashchange',route);document.getElementById('copyright').textContent='© '+new Date().getFullYear()+' '+portfolio.name;for(const id of ['emailNav','emailFooter'])document.getElementById(id).href='mailto:'+portfolio.email;route();</script></body></html>
